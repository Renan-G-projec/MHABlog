<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHABlog</title>
</head>
<body>
    <form action="/api/posts" method="POST" id="post-form">
        <p>Crie um novo post</p>
        <input type="text" placeholder="Um titulo..." name="title" required>
        <input type="text" placeholder="O corpo do texto..." name="body" required>
        <button type="submit">Criar post</button>
    </form>
    <div id="posts"></div>

    <script>
        async function fetchPosts() {
            const postsDiv = document.getElementById("posts");
            
            // Clear the posts before
            while (postsDiv.hasChildNodes()) {
                postsDiv.removeChild(postsDiv.firstChild)
            }

            try {
                const response = await fetch("/api/posts", { method: "GET" });
                const posts = await response.json();

                for (const post of posts) {
                    const postElement = document.createElement("p");

                    postElement.textContent = `${post.title} — ${post.body}`;
                    postsDiv.appendChild(postElement);
                }
            } catch (error) {
                console.error("Erro ao carregar posts:", error);
            }
        }

        window.addEventListener("DOMContentLoaded", fetchPosts);

        const postForm = document.getElementById("post-form");
        postForm.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const data = Object.fromEntries(new FormData(postForm).entries());
             
            await fetch(postForm.getAttribute("action"), {method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)});
            await fetchPosts();
        })
    </script>
</body>
</html>
